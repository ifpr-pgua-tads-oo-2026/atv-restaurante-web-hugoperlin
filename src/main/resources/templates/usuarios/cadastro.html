<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/estilo.css">
    <title>Document</title>
</head>
<body>
    <header class="app-header">
        <h1>Sistema de Restaurante</h1>
        <nav class="app-nav">
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/usuarios/cadastro">Cadastro de Usuários</a></li>
                <li><a href="/funcionarios/cadastro">Cadastro de Funcionários</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">

        <section class="card">
            <h2>Cadastrar Novo Usuário</h2>
            <h3 th:if="${mensagem}" th:text="${mensagem}"></h3>

            <form action="/usuarios/cadastro" method="post" class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" name="nome" id="nome" required/>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="text" name="email" id="email" required/>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" name="cpf" id="cpf" required/>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" name="telefone" id="telefone" required/>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <a href="/" class="btn-secondary">Cancelar</a>
                </div>
                
            </form>
        </section>
    </main>
    <footer class="app-footer">
         <p>&copy; 2026 - Sistema de Restaurante</p>
    </footer>
</body>
</html>
